<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตั้งค่าฐานข้อมูล - คณะวิทยาการจัดการ มจร</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --input-bg: #ffffff;
      --success: #16a34a;
      --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090d16;
        --card-bg: #131b2e;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #1e293b;
        --input-bg: #0f172a;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Sarabun", sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .logo {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: white;
      margin-bottom: 10px;
    }
    .logo svg { width: 30px; height: 30px; fill: white; }
    h1 { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    p.subtitle { font-size: 13px; color: var(--text-muted); }

    .mode-selector {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
    }
    .mode-card {
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.15s ease;
      background: var(--card-bg);
    }
    .mode-card:hover { border-color: #93c5fd; }
    .mode-card.selected {
      border-color: var(--primary);
      background: rgba(37, 99, 235, 0.04);
    }
    .mode-card input[type="radio"] {
      margin-top: 3px;
      accent-color: var(--primary);
      cursor: pointer;
      width: 16px;
      height: 16px;
    }
    .mode-content { flex: 1; }
    .mode-title { font-size: 13px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 6px; }
    .mode-badge {
      font-size: 10px;
      font-weight: 600;
      background: #dbeafe;
      color: #1e40af;
      padding: 1px 6px;
      border-radius: 9999px;
    }
    .mode-desc { font-size: 11px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; }

    .central-form {
      border-top: 1px dashed var(--border);
      padding-top: 16px;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .central-form.hidden { display: none; }

    .form-group { margin-bottom: 14px; }
    .form-row { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; color: var(--text); }
    input[type="text"], input[type="number"], input[type="password"] {
      width: 100%;
      height: 38px;
      padding: 8px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }

    .status-box {
      display: none;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .status-box.ok { display: block; background: rgba(22, 163, 74, 0.1); border: 1px solid rgba(22, 163, 74, 0.2); color: var(--success); }
    .status-box.bad { display: block; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.2); color: var(--error); }

    .actions { display: flex; gap: 10px; margin-top: 20px; }
    button {
      flex: 1;
      height: 40px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.15s, opacity 0.15s;
      border: none;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-test { background: var(--bg); border: 1px solid var(--border); color: var(--text); }
    .btn-test:hover:not(:disabled) { background: var(--border); }
    .btn-save { background: var(--primary); color: white; }
    .btn-save:hover:not(:disabled) { background: var(--primary-hover); }
    .hint { font-size: 11px; color: var(--text-muted); margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>
      </div>
      <h1>ตั้งค่าฐานข้อมูลระบบ FMS MCU</h1>
      <p class="subtitle">เลือกรูปแบบการจัดเก็บฐานข้อมูลที่ต้องการใช้งาน</p>
    </div>

    <div id="statusBox" class="status-box"></div>

    <form id="dbForm">
      <div class="mode-selector">
        <label class="mode-card selected" id="cardEmbedded">
          <input type="radio" name="dbMode" value="embedded" checked>
          <div class="mode-content">
            <div class="mode-title">
              ฐานข้อมูลในตัวโปรแกรม (Embedded Local DB)
              <span class="mode-badge">แนะนำ</span>
            </div>
            <div class="mode-desc">รัน PostgreSQL ในตัวเครื่องอัตโนมัติ 100% Offline บันทึกข้อมูลและใช้งานได้ทันที ไม่ต้องมีเน็ตหรือเซิร์ฟเวอร์</div>
          </div>
        </label>

        <label class="mode-card" id="cardCentral">
          <input type="radio" name="dbMode" value="central">
          <div class="mode-content">
            <div class="mode-title">เชื่อมต่อฐานข้อมูลส่วนกลาง (Central PostgreSQL)</div>
            <div class="mode-desc">เชื่อมต่อไปยังเซิร์ฟเวอร์ฐานข้อมูลของคณะ/มหาวิทยาลัย เพื่อแชร์ข้อมูลร่วมกันหลายเครื่อง</div>
          </div>
        </label>
      </div>

      <div id="centralFields" class="central-form hidden">
        <div class="form-row">
          <div class="form-group">
            <label for="host">Server Host / IP Address *</label>
            <input type="text" id="host" placeholder="เช่น 192.168.1.100 หรือ db.mcu.ac.th" value="localhost">
          </div>
          <div class="form-group">
            <label for="port">Port *</label>
            <input type="number" id="port" value="5432">
          </div>
        </div>

        <div class="form-group">
          <label for="database">Database Name *</label>
          <input type="text" id="database" value="ums_dev" placeholder="เช่น fms_mcu หรือ ums_dev">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="user">Username *</label>
            <input type="text" id="user" value="postgres">
          </div>
          <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" placeholder="รหัสผ่านฐานข้อมูล">
          </div>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="testBtn" class="btn-test" style="display: none;">ทดสอบการเชื่อมต่อ</button>
        <button type="submit" id="saveBtn" class="btn-save">เริ่มใช้งานโปรแกรม</button>
      </div>
      <p class="hint">ข้อมูลและการตั้งค่าจะถูกจัดเก็บในเครื่องอย่างปลอดภัย (%APPDATA%\FMS-MCU)</p>
    </form>
  </div>

  <script>
    const form = document.getElementById("dbForm");
    const testBtn = document.getElementById("testBtn");
    const saveBtn = document.getElementById("saveBtn");
    const statusBox = document.getElementById("statusBox");
    const centralFields = document.getElementById("centralFields");
    const cardEmbedded = document.getElementById("cardEmbedded");
    const cardCentral = document.getElementById("cardCentral");

    function getSelectedMode() {
      const radio = document.querySelector('input[name="dbMode"]:checked');
      return radio ? radio.value : "embedded";
    }

    function updateModeUI() {
      const mode = getSelectedMode();
      if (mode === "embedded") {
        cardEmbedded.classList.add("selected");
        cardCentral.classList.remove("selected");
        centralFields.classList.add("hidden");
        testBtn.style.display = "none";
        saveBtn.textContent = "เริ่มใช้งานโปรแกรม (Embedded DB)";
      } else {
        cardCentral.classList.add("selected");
        cardEmbedded.classList.remove("selected");
        centralFields.classList.remove("hidden");
        testBtn.style.display = "inline-flex";
        saveBtn.textContent = "บันทึกและเริ่มโปรแกรม";
      }
      statusBox.style.display = "none";
    }

    document.querySelectorAll('input[name="dbMode"]').forEach(radio => {
      radio.addEventListener("change", updateModeUI);
    });

    function showStatus(ok, msg) {
      statusBox.className = "status-box " + (ok ? "ok" : "bad");
      statusBox.textContent = msg;
      statusBox.style.display = "block";
    }

    // Load existing config if available
    if (window.electronAPI && window.electronAPI.getConfig) {
      window.electronAPI.getConfig().then(cfg => {
        if (cfg) {
          if (cfg.mode === "central") {
            document.querySelector('input[name="dbMode"][value="central"]').checked = true;
          } else {
            document.querySelector('input[name="dbMode"][value="embedded"]').checked = true;
          }
          if (cfg.host) document.getElementById("host").value = cfg.host;
          if (cfg.port) document.getElementById("port").value = cfg.port;
          if (cfg.database) document.getElementById("database").value = cfg.database;
          if (cfg.user) document.getElementById("user").value = cfg.user;
          if (cfg.password) document.getElementById("password").value = cfg.password;
          updateModeUI();
        }
      }).catch(() => {});
    }

    function getPayload() {
      const mode = getSelectedMode();
      return {
        mode,
        host: document.getElementById("host").value.trim(),
        port: parseInt(document.getElementById("port").value.trim(), 10) || 5432,
        database: document.getElementById("database").value.trim(),
        user: document.getElementById("user").value.trim(),
        password: document.getElementById("password").value,
      };
    }

    testBtn.addEventListener("click", async () => {
      const payload = getPayload();
      testBtn.disabled = true;
      testBtn.textContent = "กำลังทดสอบ...";
      statusBox.style.display = "none";

      try {
        const res = await window.electronAPI.testConnection(payload);
        if (res.ok) {
          showStatus(true, "✔ เชื่อมต่อเซิร์ฟเวอร์ PostgreSQL สำเร็จพร้อมใช้งาน!");
        } else {
          showStatus(false, "✖ เชื่อมต่อไม่สำเร็จ: " + (res.error || "กรุณาตรวจสอบ IP, Port และรหัสผ่าน"));
        }
      } catch (err) {
        showStatus(false, "✖ เกิดข้อผิดพลาด: " + (err.message || String(err)));
      } finally {
        testBtn.disabled = false;
        testBtn.textContent = "ทดสอบการเชื่อมต่อ";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = getPayload();
      saveBtn.disabled = true;
      saveBtn.textContent = "กำลังเริ่มต้นระบบ...";

      try {
        const res = await window.electronAPI.saveConfig(payload);
        if (!res.ok) {
          showStatus(false, "เริ่มต้นไม่สำเร็จ: " + (res.error || ""));
          saveBtn.disabled = false;
          updateModeUI();
        }
      } catch (err) {
        showStatus(false, "เกิดข้อผิดพลาด: " + (err.message || String(err)));
        saveBtn.disabled = false;
        updateModeUI();
      }
    });

    updateModeUI();
  </script>
</body>
</html>
